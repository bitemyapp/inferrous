[workspace]
members = ["crates/inferrous-qwen3"]
exclude = ["vendor/cuda-oxide"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitemyapp/inferrous"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
